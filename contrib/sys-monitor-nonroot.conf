# /etc/systemd/system/sys-monitor.service.d/nonroot.conf
# Run the node agent as an unprivileged user (installed by contrib/install-nonroot.sh).
# A drop-in rather than a second unit, so `update.sh` rewriting sys-monitor.service
# keeps it. Sorts before threats.conf, which adds its own ReadWritePaths afterwards.
[Service]
User=sys-monitor
SupplementaryGroups=systemd-journal adm
# sudo (service control, reboot/shutdown, kill) needs setuid, so this must stay false.
NoNewPrivileges=false
UMask=0027
StateDirectoryMode=0750

# The agent must not be able to rewrite its own code: drop the base unit's
# writable /opt/sys-monitor and keep every file it writes under the state dir.
ReadWritePaths=
Environment=SYSMONITOR_SERVICES_FILE=/var/lib/sys-monitor/services.json
Environment=HIDDENSCOPE_ALLOWLIST_FILE=/var/lib/sys-monitor/hiddenscope_allowlist.json
Environment=HIDDENSCOPE_BASELINE_FILE=/var/lib/sys-monitor/hiddenscope_baseline.json

# Opt-in: without these, `ss -p` and /proc/<pid>/exe only show this user's own
# processes, so the Security tab loses process names for other users' sockets.
# They are broad read powers (ptrace-level): enable only if you need that view.
#AmbientCapabilities=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE
