# Optional drop-in for hosts with an NVIDIA GPU, so /api/gpu can run nvidia-smi.
# The shipped unit uses PrivateDevices=true, which hides /dev/nvidia*.
# Install:
#   sudo mkdir -p /etc/systemd/system/sys-monitor.service.d
#   sudo cp contrib/sys-monitor-gpu.conf /etc/systemd/system/sys-monitor.service.d/gpu-access.conf
#   sudo systemctl daemon-reload && sudo systemctl restart sys-monitor
[Service]
PrivateDevices=false
DevicePolicy=closed
DeviceAllow=/dev/null rw
DeviceAllow=/dev/zero rw
DeviceAllow=/dev/urandom r
DeviceAllow=/dev/random r
DeviceAllow=char-nvidia rw
DeviceAllow=char-nvidia-uvm rw
DeviceAllow=char-nvidia-caps rw
