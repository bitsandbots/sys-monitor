# /etc/systemd/system/sys-monitor.service.d/threats.conf
# Threat detection + IP blocker on a hardened (non-root) install.
[Service]
# Read sshd from the journal and web logs under /var/log without running as root.
SupplementaryGroups=systemd-journal adm
# sudo inherits ProtectSystem=strict, so the root helper needs a writable state dir.
ReadWritePaths=/var/lib/sysmon-block
