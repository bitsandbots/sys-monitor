name: CI

on:
  push:
    # 'ci/**' lets a self-hosted Gitea Actions instance build PR heads that a sync
    # script pushes there as ci/pr-N. No effect on GitHub-hosted runs.
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r hub/requirements.txt -r requirements-dev.txt

      - name: Compile check
        run: python3 -m py_compile sys_monitor.py hub/sys_monitor_hub.py hiddenscope_scanner.py

      - name: Run tests
        run: python3 -m pytest tests/ hub/tests/ -v
